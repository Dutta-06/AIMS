# Corpo Mailer on an always-on server: the backend, its PostgreSQL database, and Caddy, which serves
# it over https (it gets and renews the certificate by itself). Only Caddy's ports 80/443 are open to
# the internet; the backend and the database are reachable only inside this stack.
# Guide: ../docs/DEPLOY.md
name: corpo-mailer

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: corpo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: corpo_mailer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpo -d corpo_mailer"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://corpo:${DB_PASSWORD}@db:5432/corpo_mailer
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
